<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-src blob:; object-src 'none'; base-uri 'self'">
<title>SUV Design Atlas · 访问验证</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f0;color:#203d32;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}.lock-card{width:min(100%,440px);padding:40px;background:white;border:1px solid #dbe3d6;border-radius:16px;box-shadow:0 20px 60px #203d320b}.eyebrow{letter-spacing:3px;font-size:11px;font-weight:600;color:#819373}h1{font-size:28px;line-height:1.3;margin:18px 0 12px}p{font-size:14px;color:#6b7c68;line-height:1.8}label{display:block;font-size:13px;margin:28px 0 9px}input{width:100%;border:1px solid #b7c7aa;border-radius:7px;padding:13px;font:inherit;background:#fbfcf8}button{border:0;border-radius:7px;background:#315c42;color:#fff;font:inherit;cursor:pointer}#unlock{width:100%;padding:13px;margin-top:14px}button:disabled{opacity:.6;cursor:wait}input:focus-visible,button:focus-visible{outline:3px solid #b9c99a;outline-offset:3px}#status{min-height:23px;margin-top:15px;font-size:13px;color:#805a36}.foot{font-size:11px;margin:24px 0 0;border-top:1px solid #e6ebdf;padding-top:17px}.sessionbar{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#203d32;color:#fff;font-size:12px}.sessionbar button{background:transparent;border:1px solid #8fa184;border-radius:4px;padding:3px 10px;font-size:11px}iframe{display:block;width:100%;height:calc(100dvh - 36px);border:0;background:white}[hidden]{display:none!important}@media(max-width:480px){.lock-card{padding:30px 24px}h1{font-size:25px}}
</style>
</head>
<body>
<main id="gate"><section class="lock-card"><div class="eyebrow">SUV DESIGN ATLAS</div><h1>四国 SUV<br>外观设计语言研究</h1><p>输入访问密码，打开车型对照与设计语言研究。</p><form id="unlock-form"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required aria-describedby="status"><button id="unlock" type="submit">解锁研究网页 →</button><p id="status" role="status" aria-live="polite"></p></form><p class="foot">内容将在当前浏览器内解密。重新打开网页需再次输入密码。</p></section></main>
<script>
async function createEncryptedNotes(material,storage,onError){
  const entry='suv-design-atlas.notes.v1',encryptedEntry='suv-design-atlas.pages.notes.enc.v1';
  const aad=new TextEncoder().encode('suv-design-atlas-pages/notes/v1');
  const unpack=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const pack=bytes=>btoa(Array.from(new Uint8Array(bytes),b=>String.fromCharCode(b)).join(''));
  let text=null,readError=false,lastError=null,pending=Promise.resolve(),key,salt;
  try{
    const raw=storage.getItem(encryptedEntry),data=raw?JSON.parse(raw):null;
    salt=data?unpack(data.salt):crypto.getRandomValues(new Uint8Array(16));
    if(salt.length!==16)throw Error('笔记加密格式错误');
    key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    if(data)text=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unpack(data.iv),additionalData:aad},key,unpack(data.ciphertext)));
  }
  catch{readError=true;}
  return {
    getItem(name){if(name!==entry)return null;if(readError)throw Error('笔记尚未解密');return text;},
    setItem(name,value){
      if(name!==entry||typeof value!=='string'||value.length>200000)throw Error('笔记格式错误');
      if(readError)throw Error('已有笔记无法解密，请勿覆盖');
      text=value;
      pending=pending.then(async()=>{const iv=crypto.getRandomValues(new Uint8Array(12)),ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad},key,new TextEncoder().encode(value));storage.setItem(encryptedEntry,JSON.stringify({version:1,salt:pack(salt),iv:pack(iv),ciphertext:pack(ciphertext)}));lastError=null;}).catch(error=>{lastError=error;onError();});
    },
    async flush(){await pending;if(lastError)throw lastError;}
  };
}

(()=>{
'use strict';
const $=s=>document.querySelector(s),decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
$('#unlock-form').addEventListener('submit',async event=>{
  event.preventDefault();const button=$('#unlock'),field=$('#password'),status=$('#status');
  if(button.disabled)return;
  button.disabled=true;button.textContent='正在解锁…';status.textContent='';
  try{
    if(!crypto.subtle)throw Error('secure-context');
    const response=await fetch('./content.enc.json',{cache:'no-store'});
    if(!response.ok)throw Error('download');
    const payload=await response.json();
    if(payload.version!==1||payload.kdf!=='PBKDF2-SHA256'||payload.iterations!==600000)throw Error('format');
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);
    field.value='';
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv),additionalData:new TextEncoder().encode('suv-design-atlas-pages/v1'),tagLength:128},key,decode(payload.ciphertext));
    const original=new TextDecoder().decode(clear);
    if(!original.includes('localStorage.getItem(STORE)')||!original.includes('localStorage.setItem(STORE'))throw Error('format');
    window.AtlasPrivateNotes=await createEncryptedNotes(material,window.localStorage,()=>{const label=document.querySelector('#save-status');if(label)label.textContent='加密保存失败，请导出笔记备份';});
    let html=original.replaceAll('localStorage.getItem(STORE)','(window.AtlasPrivateNotes||localStorage).getItem(STORE)').replaceAll('localStorage.setItem(STORE','(window.AtlasPrivateNotes||localStorage).setItem(STORE');
    const lockControl=`<button id="pages-lock" style="position:fixed;right:16px;bottom:18px;z-index:900;background:#203d32;color:white;border:1px solid #91a27f;border-radius:7px;padding:10px 14px;cursor:pointer">重新锁定</button><script>if(window.AtlasPrivateNotes){document.querySelector('#pages-lock').addEventListener('click',async()=>{try{await window.AtlasPrivateNotes.flush();location.reload();}catch{document.querySelector('#pages-lock').textContent='笔记未保存，请先导出备份';}});}else{document.querySelector('#pages-lock').remove();}<\/script>`;
    html=html.replace('</body>',lockControl+'</body>');
    document.open();document.write(html);document.close();
  }catch(error){
    field.value='';
    status.textContent=error.name==='OperationError'?'密码不正确，或加密文件已损坏。请重新输入。':error.message==='secure-context'?'请通过 HTTPS 网址访问此页面。':'暂时无法读取研究内容，请刷新后重试。';
    field.focus();
  }finally{button.disabled=false;button.textContent='解锁研究网页 →';}
});
})();
</script>
</body>
</html>
